; PlatformIO Project Configuration for CabinBoy Cannon Example
;
; Arr, this be the configuration fer buildin' and flashin' the
; ESP32 cannon crewmate to yer board!
;
; To configure WiFi credentials, edit the build_flags below or
; create a platformio_local.ini file with your credentials.

[platformio]
default_envs = esp32-s3

; Base configuration shared by all boards
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    links2004/WebSockets@^2.4.0
    hideakitai/MsgPack@^0.4.0

; WiFi and GPIO configuration
; IMPORTANT: Change these values for your setup!
build_flags =
    -DWIFI_SSID=\"YourWiFiSSID\"
    -DWIFI_PASSWORD=\"YourWiFiPassword\"
    -DLIGHT_PIN=5
    -DSMOKE_PIN=18
    -DCABIN_BOY_DEBUG=1

; ESP32-S3 DevKitC (Xiaomi/Seeed style boards)
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; Standard ESP32 DevKit
[env:esp32]
platform = espressif32
board = esp32dev

; ESP32-C3 (RISC-V)
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1

; ESP32-S2 (single core)
[env:esp32-s2]
platform = espressif32
board = esp32-s2-saola-1

; ===========================================
; Native Testing Environment (Desktop)
; ===========================================
; Run msgpack unit tests without hardware
; Usage: pio test -e native
;
[env:native]
platform = native
test_framework = unity
lib_deps =
    hideakitai/MsgPack@^0.4.0
build_flags =
    -std=c++11
test_build_src = false
; Only run desktop tests on native platform
test_filter = test_desktop/*
