[project]
name = "piratehelm"
version = "1.0.0"
description = "Distributed Halloween prop control system with pub/sub messaging over WebSockets"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

authors = [
    {name = "PirateHelm Contributors"}
]

keywords = ["halloween", "props", "automation", "websockets", "raspberry-pi", "msgpack"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core networking - updated to latest versions
    "websockets>=13.0,<14.0",      # was 10.3 - updated for modern async patterns
    "requests>=2.32.0,<3.0.0",      # was 2.28.1 - updated for security fixes

    # Audio/data processing - updated versions
    "numpy>=1.26.0,<2.0.0",         # was 1.23.3 - Python 3.12 compatible
    "SoundFile>=0.12.0,<0.13.0",    # was 0.10.3.post1 - bug fixes
    "xmltodict>=0.13.0,<0.14.0",    # unchanged - stable version

    # Binary serialization - NEW! Replaces JSON for efficiency
    "msgpack>=1.0.0,<2.0.0",        # NEW - fast binary serialization
]

[project.optional-dependencies]
# Raspberry Pi specific dependencies (GPIO, servo control, and audio)
rpi = [
    "RPi.GPIO>=0.7.0",
    "adafruit-circuitpython-servokit>=1.3.0",
    "pyalsaaudio>=0.10.0",  # ALSA audio mixer control
]

# Audio playback (has compatibility issues with Python 3.12+)
# Only needed for ambiance.py and parrot.py
audio = [
    "playsound>=1.3.0,<2.0.0",
]

# Development dependencies (testing and linting)
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/PirateHelm"
Repository = "https://github.com/yourusername/PirateHelm"
Issues = "https://github.com/yourusername/PirateHelm/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crewmates"]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 120
target-version = "py38"
