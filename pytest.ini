[pytest]
# PirateHelm Test Configuration
# Arr, this be the chart fer runnin' our tests!

# Auto-detect async tests
asyncio_mode = auto

# Where to find our test files
testpaths = tests

# Pattern matching fer test files
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show extra test summary info
addopts = -v --tb=short

# Timeout fer async tests (seconds)
timeout = 30

# Markers fer different test types
markers =
    asyncio: mark test as async
    integration: mark test as integration test (requires MainDeck)
    gpio: mark test as requiring GPIO mocking
